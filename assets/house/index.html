<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#151613"><title>栖居 · 全屋夜景拆解</title></head><body>
<header><a class="brand" href="./" aria-label="栖居首页"><span class="brand-icon">⌑</span> 栖居 <i>HOUSE ATLAS</i></a><span class="header-note">胡桃木之家 <span> / </span> 空间与物件</span><button id="reference">原夜景 ↗</button></header>
<main><aside id="directory"><div class="aside-head"><span class="eyebrow">EXPLORE YOUR HOME</span><h1>一处家，<br>慢慢展开。</h1><p>从全屋到房间，走近每一件日常。</p></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索房间、家具…" aria-label="搜索房间或家具"></label><div class="section-label"><span>空间目录</span><span id="room-count">—</span></div><nav id="rooms" aria-label="空间目录"></nav><div id="results" aria-label="家具目录"></div><div class="aside-foot"><span class="live-dot"></span> 暖光夜景 <small>概念装修 · 非施工图</small></div></aside>
<section id="stage" aria-label="房屋三维查看器"><div class="scene-heading"><div class="eyebrow">WALNUT RESIDENCE / NIGHT</div><h2 id="view-title">全屋轴测总览</h2><span id="view-subtitle">保留生活的温度，也看见空间的秩序。</span></div><div class="view-tools"><button id="home" title="返回全屋">⌂ <span>返回全屋</span></button><button id="axon">俯视角</button><button id="fit">适配视图</button></div><div id="loading" role="status"><span class="loader-mark">⌑</span><h3>正在打开你的家</h3><p id="load-status">读取房屋模型…</p><progress id="progress" max="1" value="0"></progress><button id="retry" hidden>重新加载</button></div><div id="labels"></div><div id="inspector" hidden><span class="eyebrow" id="part-room"></span><button id="clear" aria-label="清除选择">×</button><h3 id="part-name"></h3><p id="part-info"></p><button id="isolate">仅看这件家具</button></div><div class="scene-foot"><span id="hint">拖动旋转 · 滚轮缩放 · 点击家具</span><span id="status" aria-live="polite">准备中</span></div></section></main>
<footer><button id="mobile-menu" aria-expanded="false" aria-controls="directory">空间目录 ☰</button><div class="step-title"><span class="eyebrow">EXPLORATION</span><strong id="stage-name">完整的家</strong></div><div class="timeline"><div class="stops"><button data-amount="0" class="active">01 <span>全屋组装</span></button><button data-amount="50">02 <span>房间展开</span></button><button data-amount="100">03 <span>家具排布</span></button></div><input id="explode" type="range" min="0" max="100" value="0" aria-label="拆解进度"><div id="tip">沿着时间线，探索空间的组成。</div></div><div class="amount"><span id="amount">00</span><small>%</small></div><button id="reset">复原 ↺</button></footer>
<dialog id="reference-dialog"><button id="close-reference" aria-label="关闭原夜景">关闭 ×</button><img src="./models/reference-night.jpg" alt="原 Blender 全屋轴测夜景渲染"><p>原 Blender Cycles 夜景 · 网页使用实时灯光与烘焙材质近似呈现。</p></dialog>
<script type="module" src="/src/main.js"></script></body></html>
